<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Circle (Kagami – Transparency) -->
  <circle cx="120" cy="120" r="110" stroke="#1E88E5" stroke-width="6" fill="none"/>

  <!-- Middle Circles (Tama – Contribution Circulation) -->
  <circle cx="120" cy="120" r="75" stroke="#43A047" stroke-width="4" fill="none"/>
  <circle cx="120" cy="120" r="45" stroke="#43A047" stroke-width="3" fill="none"/>

  <!-- Sword (Tsurugi – Intervention) -->
  <line x1="120" y1="40" x2="120" y2="200" stroke="#E53935" stroke-width="6" stroke-linecap="round"/>

  <!-- Three-Layer Arcs (We Choose / We Collect / We Circulate) -->
  <path d="M40 120 A80 80 0 0 1 200 120" stroke="#FDD835" stroke-width="4" fill="none"/>
  <path d="M60 120 A60 60 0 0 1 180 120" stroke="#FDD835" stroke-width="3" fill="none"/>
  <path d="M80 120 A40 40 0 0 1 160 120" stroke="#FDD835" stroke-width="2" fill="none"/>

  <!-- Text -->
  <text x="120" y="225" font-family="Arial, sans-serif" font-size="22" fill="#1E88E5" text-anchor="middle">
    WCCC
  </text>
</svg>
